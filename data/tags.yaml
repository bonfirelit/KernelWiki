## Controlled Vocabulary — Tags
## All tags used in source and wiki frontmatter must appear here.
## The validator (scripts/validate.py) rejects unknown tags.
##
## Two vendor lanes share this vocabulary. NVIDIA family tokens and `sm*`
## exact targets are the original lane; AMD family tokens and `gfx*` exact
## targets are the second lane. Both mirror
## scripts/pr_policy.py::SUPPORTED_EXACT_ARCHITECTURES and
## ARCHITECTURE_FAMILY_PREFIXES — tests/test_pr_policy.py enforces the mirror.

architectures:
  # -- NVIDIA families
  - blackwell
  - hopper
  - ampere
  - ada
  - turing
  # -- AMD families
  - cdna2
  - cdna3
  - cdna4
  - rdna3
  - rdna4
  # -- NVIDIA exact targets
  - sm75
  - sm100
  - sm100a
  - sm100f
  - sm103
